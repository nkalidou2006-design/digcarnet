<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sama Carnet</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sama Carnet">
<meta name="theme-color" content="#1B2A4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --indigo:#1B2A4A;
    --indigo-deep:#10192E;
    --paper:#FAF6EC;
    --paper-line:#E3DCC8;
    --gold:#C89B3C;
    --gold-deep:#8A6B24;
    --rouge:#B33F3F;
    --vert:#3F7A5C;
    --ink:#241F14;
    --ink-soft:#6B6455;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;justify-content:center;}
  #app{width:100%;max-width:440px;height:100vh;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input, textarea{font-family:inherit;}

  /* ---- Auth ---- */
  #auth, #completeProfile{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;background:var(--indigo);color:#fff;}
  #auth .eyebrow, #completeProfile .eyebrow{font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px;}
  #auth h1, #completeProfile h1{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1.15;margin-bottom:10px;}
  #auth p, #completeProfile p{color:#C9D0DE;font-size:14px;line-height:1.5;margin-bottom:24px;}
  #auth label, #completeProfile label{font-size:13px;color:#C9D0DE;display:block;margin-bottom:6px;}
  #auth input, #completeProfile input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:#fff;font-size:16px;margin-bottom:16px;}
  #auth input::placeholder, #completeProfile input::placeholder{color:#8892A6;}
  .btn-primary{background:var(--gold);color:var(--indigo-deep);font-weight:700;font-size:15px;padding:15px;border-radius:10px;width:100%;text-align:center;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:0.6;}
  .switch-mode{text-align:center;margin-top:18px;font-size:13px;color:#C9D0DE;}
  .switch-mode button{color:var(--gold);font-weight:600;text-decoration:underline;}
  .auth-error{background:rgba(179,63,63,0.2);border:1px solid var(--rouge);color:#F6C9C9;font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#8892A6;font-size:12px;}
  .auth-divider::before, .auth-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.15);}
  .btn-google{width:100%;padding:14px;border-radius:10px;background:#fff;color:var(--indigo-deep);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px;}
  .forgot-link{text-align:center;margin-top:14px;font-size:12px;}
  .forgot-link button{color:#C9D0DE;text-decoration:underline;}

  /* ---- Dashboard (identique au prototype) ---- */
  #dashboard{flex:1;display:flex;flex-direction:column;}
  header.top{background:var(--indigo);color:#fff;padding:22px 20px 26px;border-radius:0 0 20px 20px;}
  header.top .row{display:flex;justify-content:space-between;align-items:center;}
  header.top .shopname{font-size:16px;color:#fff;font-weight:600;letter-spacing:0.01em;}
  .profile-avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--indigo-deep);font-family:'Fraunces',serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid rgba(255,255,255,0.25);}
  .profile-avatar:active{transform:scale(0.95);}
  .account-menu-item{width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--paper-line);font-size:14px;color:var(--ink);display:flex;align-items:center;gap:12px;}
  .account-menu-item:last-child{border-bottom:none;}
  .account-menu-item.danger{color:var(--rouge);}
  .account-menu-item .icon{width:20px;text-align:center;flex-shrink:0;}
  .account-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--paper-line);}
  .account-header .profile-avatar{width:48px;height:48px;font-size:18px;border-color:var(--paper-line);}
  .account-header .name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--ink);}
  .account-header .phone{font-size:12px;color:var(--ink-soft);}
  .total-block{margin-top:16px;}
  .total-label{font-size:12px;color:#B7C0D6;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
  .total-amount{font-family:'Fraunces',serif;font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;}
  .total-sub{font-size:12px;color:#94A0BC;margin-top:2px;}
  #searchwrap{padding:16px 20px 8px;}
  #searchwrap input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--paper-line);background:#fff;font-size:14px;}
  #clientlist{flex:1;overflow-y:auto;padding:4px 20px 100px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state h3{font-family:'Fraunces',serif;font-size:18px;color:var(--ink);margin-bottom:6px;font-weight:600;}
  .empty-state p{font-size:13px;line-height:1.5;}
  .client-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--paper-line);}
  .client-row:active{background:rgba(0,0,0,0.02);}
  .client-info{display:flex;align-items:center;gap:12px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;font-family:'Fraunces',serif;flex-shrink:0;}
  .client-name{font-size:15px;font-weight:600;color:var(--ink);}
  .client-phone{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .client-amount{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;}
  .client-amount.due{color:var(--rouge);}
  .client-amount.clear{color:var(--vert);}
  .client-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;text-align:right;}
  .fab{position:absolute;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--indigo-deep);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,0.25);}
  .fab:active{transform:scale(0.95);}
  .logout-link{font-size:11px;color:#94A0BC;text-decoration:underline;margin-top:8px;display:inline-block;}

  /* ---- Modal ---- */
  .modal-overlay{position:absolute;inset:0;background:rgba(16,25,46,0.55);display:flex;align-items:flex-end;z-index:20;}
  .modal-sheet{background:var(--paper);width:100%;border-radius:20px 20px 0 0;padding:22px 20px 28px;max-height:88vh;overflow-y:auto;}
  .modal-handle{width:36px;height:4px;background:var(--paper-line);border-radius:4px;margin:0 auto 16px;}
  .modal-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;display:block;margin-bottom:6px;}
  .field input, .field textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--paper-line);background:#fff;font-size:15px;}
  .field textarea{resize:none;min-height:60px;}
  .btn-row{display:flex;gap:10px;margin-top:18px;}
  .btn-ghost{flex:1;padding:14px;border-radius:10px;border:1px solid var(--paper-line);color:var(--ink-soft);font-weight:600;font-size:14px;text-align:center;}
  .btn-row .btn-primary{flex:2;}
  .existing-client-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .pick-chip{padding:8px 12px;border-radius:20px;border:1px solid var(--paper-line);font-size:13px;background:#fff;}
  .pick-chip.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .product-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .product-row input.p-name{flex:2;padding:11px 12px;border-radius:10px;border:1px solid var(--paper-line);background:#fff;font-size:14px;}
  .product-row input.p-price{flex:1;padding:11px 12px;border-radius:10px;border:1px solid var(--paper-line);background:#fff;font-size:14px;}
  .product-row .p-remove{color:var(--rouge);font-size:18px;padding:0 4px;flex-shrink:0;}
  .add-product-link{font-size:13px;color:var(--indigo);text-decoration:underline;font-weight:600;margin-bottom:16px;display:inline-block;}
  .product-total{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--paper-line);margin-bottom:8px;font-weight:600;}
  .product-total .amt{font-family:'Fraunces',serif;font-size:20px;color:var(--indigo);}
  .detail-header{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .detail-total{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin:14px 0 4px;font-variant-numeric:tabular-nums;}
  .detail-total.clear{color:var(--vert);}
  .detail-total.due{color:var(--rouge);}
  .debt-list{margin-top:16px;border-top:1px solid var(--paper-line);}
  .debt-tabs{display:flex;gap:8px;margin-top:16px;}
  .debt-tab{flex:1;padding:9px;border-radius:8px;border:1px solid var(--paper-line);font-size:13px;font-weight:600;color:var(--ink-soft);background:#fff;text-align:center;}
  .debt-tab.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .debt-item{padding:12px 0;border-bottom:1px solid var(--paper-line);display:flex;justify-content:space-between;align-items:center;}
  .debt-item .d-left{flex:1;}
  .debt-date{font-size:11px;color:var(--ink-soft);margin-bottom:2px;}
  .debt-note{font-size:13px;color:var(--ink);}
  .item-lines{margin-bottom:2px;}
  .item-line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink);gap:12px;max-width:180px;}
  .item-line span:first-child{color:var(--ink-soft);}
  .debt-amount{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-right:10px;}
  .stamp-paid{font-size:10px;font-weight:700;color:var(--vert);border:1px solid var(--vert);border-radius:4px;padding:2px 6px;text-transform:uppercase;letter-spacing:0.04em;transform:rotate(-4deg);display:inline-block;}
  .btn-mark{font-size:12px;font-weight:600;color:var(--indigo);border:1px solid var(--indigo);border-radius:8px;padding:6px 10px;white-space:nowrap;}
  .debt-actions{margin-top:4px;}
  .link-btn{font-size:11px;color:var(--ink-soft);text-decoration:underline;margin-right:14px;padding:2px 0;}
  .link-btn.danger{color:var(--rouge);}
  .btn-sms{width:100%;margin-top:14px;padding:13px;border-radius:10px;border:1px solid var(--gold-deep);color:var(--gold-deep);font-weight:600;font-size:14px;text-align:center;background:#FBF3E3;}
  .btn-sms:disabled{opacity:0.5;}
  .toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--indigo-deep);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:40;opacity:0;transition:opacity 0.2s;}
  .toast.show{opacity:1;}
  #loading{display:flex;align-items:center;justify-content:center;flex:1;color:var(--ink-soft);font-size:13px;}
  .sub-banner{margin:14px 20px 0;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5;display:flex;align-items:flex-start;gap:10px;}
  .sub-banner.warn{background:#FCEBEF;border:1px solid var(--gold);color:var(--gold-deep);}
  .sub-banner.danger{background:#F8E6E5;border:1px solid var(--rouge);color:#7A2B2B;}
  .sub-banner b{display:block;margin-bottom:2px;}
</style>
</head>
<body>
<div id="app">

  <div id="loading">Chargement...</div>

  <div id="auth" class="hidden">
    <div class="eyebrow">Bienvenue</div>
    <h1 id="authTitle">Connecte-toi a ton carnet</h1>
    <p id="authSubtitle">Entre ton numero et ton code pour continuer.</p>
    <div id="authError" class="auth-error hidden"></div>
    <div id="signupOnlyField">
      <label for="boutiqueNameInput">Nom de votre commerce</label>
      <input id="boutiqueNameInput" type="text" placeholder="Ex: Boutique Fallou, Salon Awa, Atelier Modou">
    </div>
    <label for="phoneInput">Numero de telephone</label>
    <input id="phoneInput" type="tel" placeholder="77 123 45 67">
    <label for="pinInput">Code PIN (6 chiffres)</label>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="******">
    <button class="btn-primary" id="authSubmitBtn">Se connecter</button>
    <div class="forgot-link">
      <button id="forgotPinBtn">Code PIN oublie ?</button>
    </div>
    <div class="auth-divider">ou</div>
    <button class="btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.2 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.2 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.5c-2 1.5-4.6 2.4-7.5 2.4-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.5 5.5C39.9 37 44 31.4 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      Continuer avec Google
    </button>
    <div class="switch-mode">
      <span id="switchText">Pas encore de compte ?</span>
      <button id="switchModeBtn">Creer un compte</button>
    </div>
  </div>

  <div id="completeProfile" class="hidden">
    <div class="eyebrow">Presque termine</div>
    <h1>Complete ton profil</h1>
    <p>Encore deux infos pour finaliser ton compte Sama Carnet.</p>
    <div id="completeProfileError" class="auth-error hidden"></div>
    <label for="cpBoutiqueInput">Nom de votre commerce</label>
    <input id="cpBoutiqueInput" type="text" placeholder="Ex: Boutique Fallou, Salon Awa">
    <label for="cpPhoneInput">Numero de telephone</label>
    <input id="cpPhoneInput" type="tel" placeholder="77 123 45 67">
    <button class="btn-primary" id="cpSubmitBtn">Continuer</button>
  </div>

  <div id="dashboard" class="hidden">
    <header class="top">
      <div class="row">
        <div class="shopname" id="shopNameLabel">Ma boutique</div>
        <button class="profile-avatar" id="profileAvatarBtn">M</button>
      </div>
      <div class="total-block">
        <div class="total-label">Total a recouvrer</div>
        <div class="total-amount" id="totalAmount">0 F</div>
        <div class="total-sub" id="totalSub">0 client</div>
      </div>
    </header>
    <div id="subBannerWrap"></div>
    <div id="searchwrap"><input type="text" id="searchInput" placeholder="Rechercher un client"></div>
    <div id="clientlist"></div>
    <button class="fab" id="addBtn" aria-label="Ajouter une dette">+</button>
  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>

</div>

<script>
/* ============================================================
   CONFIGURATION - remplace ces deux valeurs par les tiennes
   Supabase > Settings > API > Project URL / anon public key
   ============================================================ */
const SUPABASE_URL = "https://vwrsqqlbarpevnnvxvxb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vtLZtmZX0Wumo2C0iI_vXw_aIIvfsVr";
const EMAIL_DOMAIN = "@carnetdigital.app";
const RENEWAL_PHONE = "76 204 68 65";
const APP_SECRET = "sv6tnQZqAZuG_GB3bedPXY78MtyqTDD0";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let profile = null;
let clients = [];
let debts = [];
let authMode = 'login';
let subscriptionExpired = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ return Math.round(n).toLocaleString('fr-FR') + ' F'; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function initials(name){
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase();
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'short'});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function phoneToEmail(phone){
  return phone.replace(/\s+/g,'') + EMAIL_DOMAIN;
}

/* ---- Gestion des produits detailles d'une dette ---- */
function parseNoteItems(note){
  if(!note) return null;
  try{
    const parsed = JSON.parse(note);
    if(Array.isArray(parsed) && parsed.every(i => i && typeof i.name === 'string' && typeof i.price === 'number')){
      return parsed;
    }
  }catch(e){}
  return null;
}
function itemsToNote(items){
  return JSON.stringify(items);
}
function itemsTotal(items){
  return items.reduce((s,i)=>s+Number(i.price||0), 0);
}
function renderDebtContent(note){
  const items = parseNoteItems(note);
  if(items && items.length){
    return `<div class="item-lines">${items.map(i=>
      `<div class="item-line"><span>${escapeHtml(i.name)}</span><span>${fmt(i.price)}</span></div>`
    ).join('')}</div>`;
  }
  return `<div class="debt-note">${note ? escapeHtml(note) : 'Dette'}</div>`;
}

/* ---- Auth ---- */
function setAuthMode(mode){
  authMode = mode;
  const isSignup = mode === 'signup';
  document.getElementById('authTitle').textContent = isSignup ? 'Cree ton compte Sama Carnet' : 'Connecte-toi a Sama Carnet';
  document.getElementById('authSubtitle').textContent = isSignup ? 'Un compte par marchand, protege par ton code PIN.' : 'Entre ton numero et ton code pour continuer.';
  document.getElementById('signupOnlyField').classList.toggle('hidden', !isSignup);
  document.getElementById('authSubmitBtn').textContent = isSignup ? 'Creer mon compte' : 'Se connecter';
  document.getElementById('switchText').textContent = isSignup ? 'Deja un compte ?' : 'Pas encore de compte ?';
  document.getElementById('switchModeBtn').textContent = isSignup ? 'Se connecter' : 'Creer un compte';
  document.getElementById('authError').classList.add('hidden');
}

function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.remove('hidden');
}

async function handleAuthSubmit(){
  const phone = document.getElementById('phoneInput').value.trim();
  const pin = document.getElementById('pinInput').value.trim();
  const boutiqueName = document.getElementById('boutiqueNameInput').value.trim();

  if(!phone){ showAuthError('Entre ton numero de telephone.'); return; }
  if(!/^\d{6}$/.test(pin)){ showAuthError('Le code PIN doit contenir exactement 6 chiffres.'); return; }
  if(authMode === 'signup' && !boutiqueName){ showAuthError('Entre le nom de ton commerce.'); return; }

  const btn = document.getElementById('authSubmitBtn');
  btn.disabled = true;
  const email = phoneToEmail(phone);

  try{
    if(authMode === 'signup'){
      const { data, error } = await sb.auth.signUp({ email, password: pin });
      if(error) throw error;
      const userId = data.user.id;
      const { error: profileError } = await sb.from('profiles').insert({
        id: userId, boutique_name: boutiqueName, phone
      });
      if(profileError) throw profileError;
      showToast('Compte cree');
      await loadEverything();
    }else{
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pin });
      if(error) throw error;
      showToast('Bienvenue');
      await loadEverything();
    }
  }catch(e){
    showAuthError(e.message.includes('Invalid login') ? 'Numero ou code PIN incorrect.' : e.message);
  }finally{
    btn.disabled = false;
  }
}

async function handleGoogleLogin(){
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google' });
  if(error) showAuthError(error.message);
}

function handleForgotPin(){
  const cleanPhone = RENEWAL_PHONE.replace(/\s+/g,'');
  const waNumber = cleanPhone.startsWith('221') ? cleanPhone : '221' + cleanPhone;
  const message = encodeURIComponent("Bonjour, j'ai oublie mon code PIN Sama Carnet, peux-tu m'aider a le reinitialiser ?");

async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null; profile = null; clients = []; debts = [];
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');

/* ---- Data loading ---- */
async function loadEverything(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ document.getElementById('auth').classList.remove('hidden'); return; }
  currentUser = user;

  const { data: profileData } = await sb.from('profiles').select('*').eq('id', user.id).single();

  if(!profileData){
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('completeProfile').classList.remove('hidden');
    return;
  }
  profile = profileData;

  const { data: clientsData } = await sb.from('clients').select('*').eq('boutique_id', user.id).is('deleted_at', null);
  clients = clientsData || [];

  const { data: debtsData } = await sb.from('debts').select('*').eq('boutique_id', user.id);
  debts = debtsData || [];

  document.getElementById('auth').classList.add('hidden');
  document.getElementById('completeProfile').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  renderDashboard();
}

async function handleCompleteProfile(){
  const boutiqueName = document.getElementById('cpBoutiqueInput').value.trim();
  const phone = document.getElementById('cpPhoneInput').value.trim();
  const errEl = document.getElementById('completeProfileError');
  errEl.classList.add('hidden');

  if(!boutiqueName){ errEl.textContent = 'Entre le nom de ton commerce.'; errEl.classList.remove('hidden'); return; }
  if(!phone){ errEl.textContent = 'Entre ton numero de telephone.'; errEl.classList.remove('hidden'); return; }

  const btn = document.getElementById('cpSubmitBtn');
  btn.disabled = true;
  try{
    const { error } = await sb.from('profiles').insert({
      id: currentUser.id, boutique_name: boutiqueName, phone
    });
    if(error) throw error;
    showToast('Profil complete');
    await loadEverything();
  }catch(e){
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  }finally{
    btn.disabled = false;
  }
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(todayISO() + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / (1000 * 60 * 60 * 24));
}

function renderSubBanner(){
  const wrap = document.getElementById('subBannerWrap');
  const days = daysUntil(profile.subscription_expiry);
  subscriptionExpired = (days !== null && days <= 0);
  if(days === null || days > 5){
    wrap.innerHTML = '';
    return;
  }
  if(days > 0){
    wrap.innerHTML = `<div class="sub-banner warn">
      <div><b>Abonnement bientot termine</b>Il te reste ${days} jour${days>1?'s':''}. Tu peux renouveler quand tu veux avec 2000F via Wave ou Orange Money au ${RENEWAL_PHONE} — merci pour ta confiance !</div>
    </div>`;
  }else{
    wrap.innerHTML = `<div class="sub-banner danger">
      <div><b>Abonnement arrive a son terme</b>Pour continuer a profiter de Sama Carnet, tu peux renouveler avec 2000F via Wave ou Orange Money au ${RENEWAL_PHONE}. N'hesite pas a me contacter si besoin.</div>
    </div>`;
  }
}

function clientBalance(clientId){
  return debts.filter(d=>d.client_id===clientId).reduce((s,d)=>s+Number(d.remaining),0);
}
function lastActivity(clientId){
  const list = debts.filter(d=>d.client_id===clientId);
  if(!list.length) return null;
  return list.reduce((a,b)=> a.date > b.date ? a : b).date;
}

function renderDashboard(){
  document.getElementById('shopNameLabel').textContent = profile.boutique_name;
  document.getElementById('profileAvatarBtn').textContent = initials(profile.boutique_name);
  renderSubBanner();
  document.getElementById('addBtn').style.opacity = subscriptionExpired ? '0.4' : '1';
  const total = debts.reduce((s,d)=>s+Number(d.remaining),0);
  document.getElementById('totalAmount').textContent = fmt(total);
  const activeClients = clients.filter(c=>clientBalance(c.id) > 0).length;
  document.getElementById('totalSub').textContent = activeClients + (activeClients>1 ? ' clients doivent' : ' client doit');

  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = document.getElementById('clientlist');
  list.innerHTML = '';

  let list_ = [...clients];
  if(query){
    list_ = list_.filter(c=>c.name.toLowerCase().includes(query) || (c.phone||'').includes(query));
  }
  list_.sort((a,b)=> clientBalance(b.id) - clientBalance(a.id));

  if(list_.length === 0){
    list.innerHTML = `<div class="empty-state">
      <h3>${query ? 'Aucun resultat' : 'Aucun client encore'}</h3>
      <p>${query ? 'Essaie un autre nom.' : 'Appuie sur + pour enregistrer ta premiere dette.'}</p>
    </div>`;
    return;
  }

  list_.forEach(c=>{
    const bal = clientBalance(c.id);
    const la = lastActivity(c.id);
    const row = document.createElement('div');
    row.className = 'client-row';
    row.innerHTML = `
      <div class="client-info">
        <div class="avatar">${initials(c.name)}</div>
        <div>
          <div class="client-name">${escapeHtml(c.name)}</div>
          <div class="client-phone">${c.phone ? escapeHtml(c.phone) : 'Sans numero'}</div>
        </div>
      </div>
      <div>
        <div class="client-amount ${bal>0?'due':'clear'}">${bal>0?fmt(bal):'Paye'}</div>
        <div class="client-meta">${la ? 'Le ' + formatDate(la) : ''}</div>
      </div>
    `;
    row.addEventListener('click', ()=>openClientDetail(c.id));
    list.appendChild(row);
  });
}

function openAddDebtModal(){

        <div class="modal-handle"></div>
        <div class="modal-title">Nouvelle dette</div>
        <div class="field">

        <div class="field"><label>Telephone (optionnel)</label><input type="tel" id="clientPhoneInput" placeholder="77 123 45 67"></div>

        </div>
      </div>
    </div>
  `;

  const productRows = document.getElementById('productRows');
  function addProductRow(name='', price=''){
    const row = document.createElement('div');
    row.className = 'product-row';
    row.innerHTML = `
      <input type="text" class="p-name" placeholder="Ex: Riz" value="${escapeHtml(name)}">
      <input type="number" inputmode="numeric" class="p-price" placeholder="Prix" value="${price}">
      <button type="button" class="p-remove">&times;</button>
    `;
    row.querySelector('.p-price').addEventListener('input', updateProductTotal);
    row.querySelector('.p-remove').addEventListener('click', ()=>{
      if(productRows.children.length > 1){ row.remove(); updateProductTotal(); }
    });
    productRows.appendChild(row);
  }
  function updateProductTotal(){
    let total = 0;
    productRows.querySelectorAll('.product-row').forEach(row=>{
      total += parseFloat(row.querySelector('.p-price').value) || 0;
    });
    document.getElementById('productTotalAmt').textContent = fmt(total);
  }
  addProductRow();
  document.getElementById('addProductRow').addEventListener('click', ()=>addProductRow());

  let selectedClientId = null;
  const chipList = document.getElementById('chipList');
  if(clients.length === 0){
    chipList.innerHTML = '<span style="font-size:12px;color:var(--ink-soft);">Aucun client encore, remplis le nom ci-dessous.</span>';
  }else{
    clients.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{
      const chip = document.createElement('button');
      chip.className = 'pick-chip';
      chip.textContent = c.name;
      chip.addEventListener('click', ()=>{
        selectedClientId = (selectedClientId === c.id) ? null : c.id;
        document.querySelectorAll('.pick-chip').forEach(el=>el.classList.remove('active'));
        if(selectedClientId){
          chip.classList.add('active');
          document.getElementById('clientNameInput').value = c.name;
          document.getElementById('clientPhoneInput').value = c.phone || '';
        }else{
          document.getElementById('clientNameInput').value = '';
          document.getElementById('clientPhoneInput').value = '';
        }
      });
      chipList.appendChild(chip);
    });
  }

  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('cancelAdd').addEventListener('click', closeModal);

  document.getElementById('confirmAdd').addEventListener('click', async ()=>{
    const name = document.getElementById('clientNameInput').value.trim();
    const phone = document.getElementById('clientPhoneInput').value.trim();

    const items = [];
    productRows.querySelectorAll('.product-row').forEach(row=>{
      const pName = row.querySelector('.p-name').value.trim();
      const pPrice = parseFloat(row.querySelector('.p-price').value);
      if(pName && pPrice > 0){ items.push({ name: pName, price: pPrice }); }
    });
    const amount = itemsTotal(items);

    if(!name){ showToast('Entre le nom du client'); return; }
    if(items.length === 0 || amount <= 0){ showToast('Ajoute au moins un produit avec un prix'); return; }

    try{
      let clientId = selectedClientId;
      if(!clientId){
        const existing = clients.find(c=>c.name.toLowerCase() === name.toLowerCase());
        if(existing){
          clientId = existing.id;
        }else{
          const { data, error } = await sb.from('clients').insert({
            boutique_id: currentUser.id, name, phone
          }).select().single();
          if(error) throw error;
          clients.push(data);
          clientId = data.id;
        }
      }

      const { data: debtData, error: debtError } = await sb.from('debts').insert({
        boutique_id: currentUser.id, client_id: clientId, amount, remaining: amount, note: itemsToNote(items), date: todayISO(), status: 'due'
      }).select().single();
      if(debtError) throw debtError;
      debts.push(debtData);

      closeModal();
      renderDashboard();
      showToast('Dette enregistree');
    }catch(e){
      showToast('Erreur: ' + e.message);
    }
  });
}

/* ---- Client detail modal ---- */
function openClientDetail(clientId){
  const client = clients.find(c=>c.id===clientId);
  if(!client) return;
  const root = document.getElementById('modalRoot');
  const bal = clientBalance(clientId);

  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="detail-header">
          <div class="avatar">${initials(client.name)}</div>

            <div class="modal-title" style="margin-bottom:0;">${escapeHtml(client.name)}</div>
            <div style="font-size:12px;color:var(--ink-soft);">${client.phone ? escapeHtml(client.phone) : 'Sans numero'}</div>
          </div>
        </div>
        <div class="detail-total ${bal>0?'due':'clear'}">${bal>0 ? fmt(bal) : 'Paye, rien a payer'}</div>
        <div class="debt-tabs" id="debtTabs">
          <button class="debt-tab active" data-tab="current">En cours</button>
          <button class="debt-tab" data-tab="history">Historique</button>
        </div>
        <div class="debt-list" id="debtList"></div>
        ${bal > 0 && client.phone ? '<button class="btn-sms" id="sendSmsBtn">Envoyer un rappel SMS</button>' : ''}

          <button class="btn-ghost" id="closeDetail">Fermer</button>
          <button class="btn-primary" id="addForClient">Ajouter une dette</button>
        </div>
        <button class="link-btn danger" id="deleteClientBtn" style="margin-top:16px;display:block;text-align:center;width:100%;">Deplacer ce client vers la corbeille</button>
      </div>
    </div>
  `;

  document.getElementById('deleteClientBtn').addEventListener('click', async ()=>{
    const ok = await showConfirm(`Deplacer ${client.name} vers la corbeille ? Tu pourras le restaurer plus tard depuis le menu de ton profil.`);
    if(!ok) return;
    try{
      const { error } = await sb.from('clients').update({ deleted_at: new Date().toISOString() }).eq('id', clientId);
      if(error) throw error;
      clients = clients.filter(c=>c.id !== clientId);
      closeModal();
      renderDashboard();
      showToast('Client deplace vers la corbeille');
    }catch(e){
      showToast('Erreur: ' + e.message);
    }
  });

  let activeTab = 'current';
  function renderDebtList(){
    const debtList = document.getElementById('debtList');
    const clientDebts = debts.filter(d=>d.client_id===clientId)
      .filter(d=> activeTab === 'current' ? Number(d.remaining) > 0 : Number(d.remaining) <= 0)
      .sort((a,b)=> b.date.localeCompare(a.date));
    debtList.innerHTML = '';
    if(clientDebts.length === 0){
      debtList.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);padding:14px 0;">${activeTab === 'current' ? 'Aucune dette en cours.' : 'Aucune dette payee pour le moment.'}</p>`;
      return;
    }
    clientDebts.forEach(d=>{
      const item = document.createElement('div');
      item.className = 'debt-item';
      item.innerHTML = `
        <div class="d-left">
          <div class="debt-date">${formatDate(d.date)}</div>
          ${renderDebtContent(d.note)}
          <div class="debt-actions">
            <button class="link-btn" data-edit-id="${d.id}">Modifier</button>
            <button class="link-btn danger" data-delete-id="${d.id}">Supprimer</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;">
          <div class="debt-amount">${activeTab === 'current' ? fmt(d.remaining) : fmt(d.amount)}</div>
          ${Number(d.remaining) > 0 ? `<button class="btn-mark" data-id="${d.id}">Marquer paye</button>` : `<span class="stamp-paid">Paye</span>`}
        </div>
      `;
      debtList.appendChild(item);
    });
    attachDebtItemHandlers();
  }

  document.querySelectorAll('.debt-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      activeTab = tab.dataset.tab;
      document.querySelectorAll('.debt-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      renderDebtList();
    });
  });

  renderDebtList();

  function attachDebtItemHandlers(){
    document.querySelectorAll('.btn-mark').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        try{
          const { error } = await sb.from('debts').update({ remaining: 0, status: 'paid' }).eq('id', btn.dataset.id);
          if(error) throw error;
          const debt = debts.find(d=>d.id===btn.dataset.id);
          if(debt){ debt.remaining = 0; debt.status = 'paid'; }
          renderDashboard();
          openClientDetail(clientId);
          showToast('Marque comme paye');
        }catch(e){
          showToast('Erreur: ' + e.message);
        }
      });
    });

    document.querySelectorAll('[data-edit-id]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openEditDebtModal(btn.dataset.editId, clientId);
      });
    });

    document.querySelectorAll('[data-delete-id]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = await showConfirm('Supprimer cette dette ? Cette action est definitive.');
        if(!ok) return;
        try{
          const { error } = await sb.from('debts').delete().eq('id', btn.dataset.deleteId);
          if(error) throw error;
          debts = debts.filter(d=>d.id !== btn.dataset.deleteId);
          renderDashboard();
          openClientDetail(clientId);
          showToast('Dette supprimee');
        }catch(e){
          showToast('Erreur: ' + e.message);
        }
      });
    });
  }

  const smsBtn = document.getElementById('sendSmsBtn');
  if(smsBtn){
    smsBtn.addEventListener('click', async ()=>{
      smsBtn.disabled = true;
      smsBtn.textContent = 'Envoi en cours...';
      try{
        const message = `Bonjour ${client.name}, tu dois ${fmt(bal)} a ${profile.boutique_name}. Merci de passer regler des que possible.`;
        const resp = await fetch('/api/send-sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: client.phone, message, appSecret: APP_SECRET })
        });
        const data = await resp.json();
        if(data.success){
          showToast('SMS envoye a ' + client.name);
        }else{
          showToast('Erreur envoi SMS');
        }
      }catch(e){
        showToast('Erreur: ' + e.message);
      }finally{
        smsBtn.disabled = false;
        smsBtn.textContent = 'Envoyer un rappel SMS';
      }
    });
  }

  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('closeDetail').addEventListener('click', closeModal);
  document.getElementById('addForClient').addEventListener('click', ()=>{ closeModal(); openAddDebtModal(); });
}

        </div>
      </div>

  }

  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Changer mon code PIN</div>
        <div class="field"><label>Code PIN actuel</label><input type="password" inputmode="numeric" maxlength="6" id="currentPinInput" placeholder="******"></div>
        <div class="field"><label>Nouveau code PIN (6 chiffres)</label><input type="password" inputmode="numeric" maxlength="6" id="newPinInput" placeholder="******"></div>
        <div class="field"><label>Confirme le nouveau code</label><input type="password" inputmode="numeric" maxlength="6" id="confirmPinInput" placeholder="******"></div>
        <div class="btn-row">
          <button class="btn-ghost" id="cancelPin">Annuler</button>
          <button class="btn-primary" id="confirmPin">Enregistrer</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('cancelPin').addEventListener('click', closeModal);
  document.getElementById('confirmPin').addEventListener('click', async ()=>{
    const currentPin = document.getElementById('currentPinInput').value.trim();
    const newPin = document.getElementById('newPinInput').value.trim();
    const confirmPin = document.getElementById('confirmPinInput').value.trim();
    if(!/^\d{6}$/.test(currentPin)){ showToast('Entre ton code actuel (6 chiffres)'); return; }
    if(!/^\d{6}$/.test(newPin)){ showToast('Le nouveau code doit contenir 6 chiffres'); return; }

        email: currentUser.email, password: currentPin
      });
      if(verifyError){ showToast('Ton code actuel est incorrect'); return; }

      // Etape 2 : le code actuel est confirme, on peut mettre a jour
      const { error } = await sb.auth.updateUser({ password: newPin });
      if(error) throw error;
      closeModal();
      showToast('Code PIN mis a jour');
    }catch(e){
      showToast('Erreur: ' + e.message);
    }
  });
}

/* ---- Confirmation personnalisee (fiable sur mobile/PWA, contrairement a confirm() natif) ---- */
function showConfirm(message){
  return new Promise((resolve)=>{
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="modal-overlay" id="overlay">
        <div class="modal-sheet">
          <div class="modal-handle"></div>
          <p style="font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:18px;">${escapeHtml(message)}</p>
          <div class="btn-row">
            <button class="btn-ghost" id="confirmNo">Annuler</button>
            <button class="btn-primary" id="confirmYes">Confirmer</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('confirmNo').addEventListener('click', ()=>{ closeModal(); resolve(false); });
    document.getElementById('confirmYes').addEventListener('click', ()=>{ closeModal(); resolve(true); });
  });
}
async function openTrashModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Corbeille</div>
        <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">Les clients supprimes restent ici. Tu peux les restaurer a tout moment.</p>
        <div id="trashList"><p style="font-size:13px;color:var(--ink-soft);">Chargement...</p></div>
        <div class="btn-row"><button class="btn-ghost" id="closeTrash" style="flex:1;">Fermer</button></div>
      </div>
    </div>
  `;
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('closeTrash').addEventListener('click', closeModal);

  const { data: trashed, error } = await sb.from('clients').select('*').eq('boutique_id', currentUser.id).not('deleted_at', 'is', null);
  const trashList = document.getElementById('trashList');
  if(error){ trashList.innerHTML = '<p style="font-size:13px;color:var(--rouge);">Erreur de chargement.</p>'; return; }
  if(!trashed || trashed.length === 0){ trashList.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">La corbeille est vide.</p>'; return; }

  trashList.innerHTML = '';
  trashed.forEach(c=>{
    const row = document.createElement('div');
    row.className = 'client-row';
    row.innerHTML = `
      <div class="client-info">
        <div class="avatar">${initials(c.name)}</div>
        <div>
          <div class="client-name">${escapeHtml(c.name)}</div>
          <div class="client-phone">${c.phone ? escapeHtml(c.phone) : 'Sans numero'}</div>
        </div>
      </div>
      <button class="btn-mark" data-restore-id="${c.id}">Restaurer</button>
    `;
    trashList.appendChild(row);
  });

  trashList.querySelectorAll('[data-restore-id]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const { error } = await sb.from('clients').update({ deleted_at: null }).eq('id', btn.dataset.restoreId);
        if(error) throw error;
        showToast('Client restaure');
        closeModal();
        await loadEverything();
      }catch(e){
        showToast('Erreur: ' + e.message);
      }
    });
  });
}

/* ---- Export des donnees (PDF) ---- */
function handleExport(){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();
    const marginX = 15;
    let y = 20;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('Sama Carnet - Export', marginX, y);
    y += 8;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(100);
    doc.text(`${profile.boutique_name} - Exporte le ${new Date().toLocaleDateString('fr-FR')}`, marginX, y);
    y += 10;
    doc.setDrawColor(220);
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 8;

    if(clients.length === 0){
      doc.setTextColor(80);
      doc.text('Aucun client enregistre.', marginX, y);
    }

    clients.forEach(c=>{
      const clientDebts = debts.filter(d=>d.client_id === c.id).sort((a,b)=>a.date.localeCompare(b.date));
      const bal = clientBalance(c.id);

      if(y > 270){ doc.addPage(); y = 20; }

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.setTextColor(20);
      doc.text(`${c.name}${c.phone ? '  -  ' + c.phone : ''}`, marginX, y);
      doc.setTextColor(bal > 0 ? 180 : 60, bal > 0 ? 60 : 120, bal > 0 ? 60 : 90);
      doc.text(bal > 0 ? `Doit : ${fmt(bal)}` : 'Paye', pageWidth - marginX, y, { align: 'right' });
      y += 6;

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(90);

      if(clientDebts.length === 0){
        doc.text('  Aucune dette enregistree.', marginX, y);
        y += 6;
      }

      clientDebts.forEach(d=>{
        if(y > 275){ doc.addPage(); y = 20; }
        const items = parseNoteItems(d.note);
        const detail = items ? items.map(i=>`${i.name} (${fmt(i.price)})`).join(', ') : (d.note || 'Dette');
        const status = Number(d.remaining) > 0 ? `Reste ${fmt(d.remaining)}` : 'Paye';
        const line = `  ${formatDate(d.date)} - ${detail} - Total ${fmt(d.amount)} - ${status}`;
        const wrapped = doc.splitTextToSize(line, pageWidth - marginX * 2);
        doc.text(wrapped, marginX, y);
        y += wrapped.length * 5;
      });
      y += 6;
    });

    doc.save(`sama-carnet-export-${todayISO()}.pdf`);
    showToast('Export PDF telecharge');
  }catch(e){
    showToast('Erreur export: ' + e.message);
  }
}
